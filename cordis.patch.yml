# Steak DSH bundle layer. Applied after the bundles listed before it in the profile.
# Every row can be switched off from your own profile patch:  - id: <row id>\n    disabled: true

# A one-shot run needs no model-written session title; the word-based fallback title stays.
- id: session-title-llm
  disabled: true

# Tools a one-shot coding task does not use. Each one is schema text sent with every request.
- id: tool-goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-working-directory
  disabled: true

- insert:
    - id: steak-rules
      name: ./plugins/rules.js
      config: {}
    # One small tool that switches the heavier tools (subagents, follow-up, working directory) on when the model asks.
    - id: steak-more-tools
      name: ./plugins/more-tools.js
      config: {}
    # Acts only when a turn ends with open todo items or a reply that reports unfinished work (at most 3 pushes,
    # never on subagent children). It costs no schema text. Switch it off from your profile patch with
    #   - id: steak-finish-guard
    #     disabled: true
    - id: steak-finish-guard
      name: ./plugins/finish-guard.js
      config:
        maxPushes: 3
    - id: steak-verify-after-edit
      name: ./plugins/verify-after-edit.js
      config: {}
    # With approval policy "never" (the steak-dsh default) a call that asks for a wider sandbox is refused up front
    # with the preset that would allow it, instead of the harness's "the user rejected" wording. Inert otherwise.
    - id: steak-approval-never
      name: ./plugins/approval-never.js
      config: {}
    # A model route that runs requests through a locally installed, logged-in coding CLI (see README). It starts nothing
    # until a model is listed or requested; with no CLI (or no login) it offers no models. Switch it off with
    #   - id: steak-cc-route
    #     disabled: true
    - id: steak-cc-route
      name: ./plugins/cc-route.js
      config: {}
    # A model route that sends requests to a hosted Responses endpoint on the login a coding CLI already keeps on this
    # machine (see README). It reads nothing until a model is listed or requested; with no login it offers no models.
    # Switch it off with
    #   - id: steak-codex-route
    #     disabled: true
    - id: steak-codex-route
      name: ./plugins/codex-route.js
      config: {}
    # A model route that runs requests on a Google Antigravity sign-in (see README). Off until
    # $DSH_HOME/steak-dsh-antigravity.json says "enabled": true: with no file it reads that one path and loads nothing,
    # registers no model and ships no OAuth client. Switch it off entirely from your profile patch with
    #   - id: steak-antigravity-route
    #     disabled: true
    - id: steak-antigravity-route
      name: ./plugins/antigravity-route.js
      config: {}
