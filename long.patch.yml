# Steak DSH long-work profile. Applied after cordis.patch.yml, by `steak-dsh run --long` or by hand:
#   dsh headless --patch <bundle>/cordis.patch.yml --patch <bundle>/long.patch.yml "<task>"
# The default bundle is tuned for one-shot tasks. A long, multi-step or delegating task needs the rows below.

# Delegation: the subagent tool, the follow-up tool for a running child, and the working-directory switch.
- id: tool-subagent
  disabled: false
- id: tool-subagent-control
  disabled: false
- id: tool-working-directory
  disabled: false

# A long task is where a turn ends with parts still open. Subagent children are left alone.
- id: steak-finish-guard
  disabled: false

# An oversized tool result keeps its head and tail inline and a path to the full text.
- id: spill-policy
  config:
    maxInlineTokens: 12500
